name: macos-latest

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - run: uname -a

    - env:
        MKN_LIB_LINK_LIB: 1
      run: |
        curl -fL --retry 3 --retry-delay 2 -o mkn https://github.com/mkn/mkn/releases/download/latest/mkn_arm_osx
        chmod +x mkn
        KLOG=2 ./mkn clean build run -dtOa "-std=c++17 -fPIC"
