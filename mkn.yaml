#! clean build -g 0 -W 9 -O 9

name: subl.lsp-clangd
version: master

parent: base
src: mod.cpp
mode: shared

profile:
- name: base
  dep: mkn.mod
  if_dep:
    bsd: parse.yaml[lib]
    win: parse.yaml[lib]
  if_arg:
    win_static: -DYAML_CPP_STATIC_DEFINE
    shared: -DMKN_KUL_SHARED

- name: test
  parent: base
  mod: subl.lsp-clangd
  src: mod.cpp

- name: format
  mod: |
    clang.format{init:{style: google, paths: .}}

- name: lsp
  parent: base
  mod: subl.lsp-clangd # {init:{remove:{rofl, copter}, add:{loller, skates}}}
